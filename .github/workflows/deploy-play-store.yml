name: Deploy Android to Google Play Store

on:
  workflow_dispatch:

jobs:
  build-and-deploy-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android App Bundle (.aab)
        run: ./gradlew :androidApp:bundleRelease --no-daemon

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-release-aab
          path: androidApp/build/outputs/bundle/release/androidApp-release.aab

      - name: Deploy to Google Play Store
        uses: rwsander/play-store-api-release@v2
        if: env.PLAY_STORE_JSON != ''
        env:
          PLAY_STORE_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.dirzaaulia.loottrack
          appFile: androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: internal
