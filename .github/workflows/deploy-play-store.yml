name: Deploy Android to Google Play Store

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/615093290588/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'loottrack@loottrack-app.iam.gserviceaccount.com'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android App Bundle (.aab)
        run: ./gradlew :androidApp:bundleRelease --no-daemon

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-release-aab
          path: androidApp/build/outputs/bundle/release/androidApp-release.aab

      - name: Deploy to Google Play Store (App Bundle + Listing Metadata)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dirzaaulia.loottrack
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: production
          status: completed
          whatsNewDirectory: fastlane/metadata/android/en-US/changelogs
          mappingFile: androidApp/build/outputs/mapping/release/mapping.txt
